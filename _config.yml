remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark"

locale: "en-US"
title: "Faiq Ramzan"
title_separator: "|"
name: "Faiq Ramzan"
description: >-
  Faiq Ramzan is Director of Engineering at Ebryx in Lahore, leading teams in
  agentic AI security, Linux kernel research, red team tooling, and
  vulnerability research. Writes on reverse engineering and offensive security.
url: "https://faiqramzan.com"
baseurl: ""
repository: "faiqramzan/faiqramzan.github.io"
teaser: "/assets/images/faiq-ramzan.jpg"
og_image: "/assets/images/og-card.png"
og_image_alt: "Faiq Ramzan — Director of Engineering, Ebryx"
masthead_title: "Faiq Ramzan"
words_per_minute: 200

author:
  name: "Faiq Ramzan"
  avatar: "/assets/images/faiq-ramzan-avatar.jpg"
  bio: "Director of Engineering at Ebryx. Agentic AI security, Linux kernel research, red team tooling, vulnerability research, reverse engineering."
  location: "Lahore, Pakistan"
  email: "faiq@faiqramzan.com"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/faiq-ramzan/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/faiqramzan"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/faiqnoodles"

footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/faiq-ramzan/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/faiqramzan"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/faiqnoodles"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-gist

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
      toc: true
      toc_sticky: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

include:
  - _pages
markdown: kramdown
sass:
  style: compressed
highlighter: rouge
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
