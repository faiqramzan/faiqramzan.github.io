<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ site.url }}/#person",
  "name": "Faiq Ramzan",
  "url": "{{ site.url }}/",
  "image": "{{ site.url }}/assets/images/faiq-ramzan.jpg",
  "jobTitle": "Director of Engineering",
  "description": "Offensive security leader. Kernel exploit development, C2 development, agentic AI security.",
  "worksFor": {
    "@type": "Organization",
    "name": "Ebryx"
  },
  "alumniOf": {
    "@type": "CollegeOrUniversity",
    "name": "FAST National University of Computer & Emerging Sciences (NUCES)"
  },
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Lahore",
    "addressCountry": "PK"
  },
  "knowsAbout": [
    "Agentic AI Security",
    "LLM Security",
    "Linux Kernel Research",
    "Exploit Development",
    "Red Team Tooling",
    "C2 Development",
    "Vulnerability Research",
    "Reverse Engineering",
    "Malware Analysis"
  ],
  "sameAs": [
    "https://www.linkedin.com/in/faiq-ramzan/",
    "https://github.com/faiqramzan",
    "https://instagram.com/faiqnoodles"
  ]
}
</script>
{% if page.collection == "posts" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | jsonify }},
  "url": "{{ page.url | absolute_url }}",
  "mainEntityOfPage": "{{ page.url | absolute_url }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
  "image": "{{ page.header.og_image | default: site.og_image | absolute_url }}",
  "keywords": {{ page.tags | jsonify }},
  "author": { "@id": "{{ site.url }}/#person" },
  "publisher": { "@id": "{{ site.url }}/#person" }
}
</script>
{% endif %}
